cmd:
  laps:
    use: "laps"
    short: "FPV Lap Timer"
    long: "Laps — open-source lap timing system для FPV дрон-рейсинга"
    flags:
      lang:
        usage: "Язык (переопределяет конфиг)"
      loglevel:
        usage: "Уровень логирования: debug, info, warn, error"

  hello:
    use: "hello"
    short: "Вывести приветствие"
    long: "Выводит приветственное сообщение"

  rssi:
    use: "rssi"
    short: "Привет от RSSI сенсора"
    long: "Выводит привет от RSSI сенсора"

  speak:
    use: "speak [текст]"
    short: "Произнести текст"
    long: |
      Произносит текст через Google Translate TTS.

      Аудио кешируется в ~/.cache/laps/tts/ для повторного использования.
      Максимальный размер кеша: 200 KB (старые файлы удаляются автоматически).

      Установка зависимостей для воспроизведения:
        macOS:    встроенный afplay (или brew install ffmpeg)
        Debian:   sudo apt install ffmpeg
        Arch:     sudo pacman -S ffmpeg
