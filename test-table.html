<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Настроечная таблица</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            html,
            body {
                width: 100%;
                height: 100%;
                background: #000;
                overflow: hidden;
                font-family: "SF Mono", "Menlo", "Consolas", "Liberation Mono", "DejaVu Sans Mono", monospace;
            }
            #container {
                width: 100%;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            #aspect-box {
                width: 100vw;
                height: calc(100vw * 9 / 16);
                max-height: 100vh;
                max-width: calc(100vh * 16 / 9);
                display: grid;
                grid-template-columns: 1fr 1fr;
                grid-template-rows: 1fr 1fr;
                gap: 0;
            }
            .cell {
                position: relative;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
                transition: transform 0.35s ease, opacity 0.35s ease;
            }
            .cell.q1 {
                transform-origin: top left;
            }
            .cell.q2 {
                transform-origin: top right;
            }
            .cell.q3 {
                transform-origin: bottom left;
            }
            .cell.q4 {
                transform-origin: bottom right;
            }

            /* Режим одиночного квадранта: выбранный cell зумится scale(2)
               из своего угла и заполняет весь aspect-box, остальные тают.
               Шрифты и рамки масштабируются трансформом сами. */
            #aspect-box.single .cell {
                opacity: 0;
                pointer-events: none;
            }
            #aspect-box.single .cell.zoomed {
                opacity: 1;
                pointer-events: auto;
                transform: scale(2);
                z-index: 2;
            }

            /* Кнопки-контролы поверх таблицы: слева — переключение видов
               (всегда), справа — фуллскрин/закрытие (только когда страницу
               открыл нативный хост, см. host-controls в скрипте). */
            .ctrl-btn {
                width: 32px;
                height: 32px;
                padding: 0;
                border: none;
                border-radius: 6px;
                background: transparent;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .ctrl-btn:hover {
                background: rgba(70, 70, 70, 0.85);
            }
            .ctrl-btn:focus {
                outline: none;
            }
            .ctrl-btn svg {
                width: 18px;
                height: 18px;
                display: block;
            }

            #view-btn {
                position: fixed;
                top: 8px;
                left: 8px;
                z-index: 10;
            }

            /* По умолчанию скрыты: показывает их только нативный хост. */
            #host-controls {
                position: fixed;
                top: 8px;
                right: 8px;
                z-index: 10;
                display: none;
                gap: 6px;
            }
            #host-controls.shown {
                display: flex;
            }

            .waves {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                z-index: 0;
            }

            .dashed-16 {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
            }
            .dashed-16.red {
                border: 4px dashed #ff0000;
            }
            .dashed-16.blue {
                border: 4px dashed #3333ff;
            }
            .dashed-16.green {
                border: 4px dashed #00cc00;
            }
            .dashed-16.yellow {
                border: 4px dashed #ffbf00;
            }

            .solid-43 {
                position: absolute;
                top: 0;
                bottom: 0;
                left: 50%;
                transform: translateX(-50%);
                width: auto;
                aspect-ratio: 4 / 3;
                height: 100%;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                text-align: center;
                z-index: 1;
            }
            .solid-43.red {
                border: 4px solid #ff0000;
            }
            .solid-43.blue {
                border: 4px solid #3333ff;
            }
            .solid-43.green {
                border: 4px solid #00cc00;
            }
            .solid-43.yellow {
                border: 4px solid #ffbf00;
            }

            .label {
                font-size: 8vw;
                font-weight: bold;
                line-height: 1;
            }
            .label.red {
                color: #ff0000;
            }
            .label.blue {
                color: #3333ff;
            }
            .label.green {
                color: #00cc00;
            }
            .label.yellow {
                color: #ffbf00;
            }

            .ticker-wrap {
                width: 100%;
                overflow: hidden;
                white-space: nowrap;
                margin-top: 1vh;
                text-align: center;
            }
            .ticker {
                display: inline-block;
                font-size: 1.8vw;
                color: #fff;
            }


        </style>
    </head>
    <body>
        <button id="view-btn" class="ctrl-btn" title="View: all quadrants"></button>
        <div id="host-controls">
            <button id="fs-btn" class="ctrl-btn" title="Fullscreen"></button>
            <button id="close-btn" class="ctrl-btn" title="Close"></button>
        </div>
        <div id="container">
            <div id="aspect-box">
                <div class="cell q1">
                    <canvas class="waves"></canvas>
                    <div class="dashed-16 red"></div>
                    <div class="solid-43 red">
                        <div class="label red">R1</div>
                        <div class="ticker-wrap">
                            <div class="ticker" id="ticker-r1"></div>
                        </div>
                    </div>
                </div>
                <div class="cell q2">
                    <canvas class="waves"></canvas>
                    <div class="dashed-16 blue"></div>
                    <div class="solid-43 blue">
                        <div class="label blue">R3</div>
                        <div class="ticker-wrap">
                            <div class="ticker" id="ticker-r3"></div>
                        </div>
                    </div>
                </div>
                <div class="cell q3">
                    <canvas class="waves"></canvas>
                    <div class="dashed-16 green"></div>
                    <div class="solid-43 green">
                        <div class="label green">R4</div>
                        <div class="ticker-wrap">
                            <div class="ticker" id="ticker-r4"></div>
                        </div>
                    </div>
                </div>
                <div class="cell q4">
                    <canvas class="waves"></canvas>
                    <div class="dashed-16 yellow"></div>
                    <div class="solid-43 yellow">
                        <div class="label yellow">R6</div>
                        <div class="ticker-wrap">
                            <div class="ticker" id="ticker-r6"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script>
            function pad(n, len) {
                return String(n).padStart(len, "0");
            }
            function formatRFC(d) {
                const y = d.getFullYear();
                const mo = pad(d.getMonth() + 1, 2);
                const da = pad(d.getDate(), 2);
                const h = pad(d.getHours(), 2);
                const mi = pad(d.getMinutes(), 2);
                const s = pad(d.getSeconds(), 2);
                const ms = pad(d.getMilliseconds(), 3);
                return `${y}-${mo}-${da} ${h}:${mi}:${s}.${ms}`;
            }

            // Точечные волны в стиле заставки AC IV: Black Flag (вид из глаз, к горизонту)
            function createWaves(canvas, color, phase, yaw) {
                const ctx = canvas.getContext("2d");
                let w = 0,
                    h = 0,
                    lastT = 0;

                // мир: камера на высоте CAM_H, повёрнута на YAW, взгляд к горизонту;
                // Z_NEAR подобран так, что ближние волны уходят под нижний край кадра
                const CAM_H = 3.0;
                const Z_NEAR = 1,
                    Z_FAR = 46;
                const STEP_PX = 12; // экранный шаг между точками (по обеим осям)
                const YAW = yaw;

                function resize() {
                    // В зуме cell масштабируется CSS-трансформом — рисуем
                    // канвас с удвоенным разрешением, чтобы точки не плыли.
                    const zoom = canvas.closest(".cell").classList.contains("zoomed") ? 2 : 1;
                    const dpr = (window.devicePixelRatio || 1) * zoom;
                    w = canvas.clientWidth;
                    h = canvas.clientHeight;
                    canvas.width = Math.round(w * dpr);
                    canvas.height = Math.round(h * dpr);
                    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                    draw(lastT);
                }
                resize();
                new ResizeObserver(resize).observe(canvas);

                function draw(t) {
                    lastT = t;
                    ctx.clearRect(0, 0, w, h);
                    ctx.fillStyle = color;
                    const tt = t * 0.001;
                    const f = w * 0.7; // фокусное расстояние
                    const cx = w * 0.5;
                    const horizon = h * 0.25;
                    const cosY = Math.cos(YAW),
                        sinY = Math.sin(YAW);
                    // Рисуем от дальних рядов к ближним. Шаг ряда dz подобран так, чтобы
                    // на экране расстояние между рядами было ~STEP_PX, как между точками в ряду.
                    for (let z = Z_FAR; z >= Z_NEAR; ) {
                        const dz = Math.min(2.5, Math.max(0.05, (STEP_PX * z * z) / (CAM_H * f)));
                        const fog = Math.pow(1 - (z - Z_NEAR) / (Z_FAR - Z_NEAR), 0.7); // 1 вблизи → 0 у горизонта
                        const aFog = 0.25 + fog * 0.75;
                        // мировой шаг ряда, дающий ~STEP_PX на экране
                        const dx = (STEP_PX * z) / f;
                        // ширина ряда — через tan(yaw + половина FOV) с запасом 15%,
                        // чтобы боковые кромки поля точек гарантированно были за экраном
                        const xMax = z * Math.tan(Math.abs(YAW) + Math.atan(cx / f)) * 1.15;
                        for (let x = -xMax; x <= xMax; x += dx) {
                            // детерминированный джиттер (±20% шага) — слегка разбивает регулярную сетку
                            const h1 = Math.sin(x * 127.1 + z * 311.7) * 43758.5453;
                            const h2 = Math.sin(x * 269.5 + z * 183.3) * 28081.3447;
                            const xj = x + (h1 - Math.floor(h1) - 0.5) * dx * 0.4;
                            const zj = z + (h2 - Math.floor(h2) - 0.5) * dz * 0.4;
                            // поворот камеры вокруг вертикальной оси
                            const rx = xj * cosY + zj * sinY;
                            const rz = zj * cosY - xj * sinY;
                            if (rz < 1.2) continue;
                            const scale = f / rz;
                            // волны: 4 компонента в разных направлениях — живая нерегулярная поверхность
                            const y =
                                0.5 * Math.sin(0.31 * xj + 0.83 * zj - tt * 1.7 + phase) +
                                0.3 * Math.sin(-0.57 * xj + 0.42 * zj + tt * 1.13 + phase * 1.7) +
                                0.22 * Math.sin(0.11 * xj - 0.97 * zj - tt * 0.71 + phase * 2.3) +
                                0.14 * Math.sin(0.71 * xj + 0.29 * zj + tt * 2.3);
                            const sx = cx + rx * scale;
                            if (sx < -4 || sx > w + 4) continue;
                            const sy = horizon + (CAM_H - y) * scale;
                            if (sy < -4 || sy > h + 4) continue;
                            const k = (y + 1.16) / 2.32; // 0..1: впадина..гребень
                            const r = Math.min(3.0, Math.max(0.75, 0.0195 * scale));
                            ctx.globalAlpha = (0.12 + k * 0.88) * aFog;
                            ctx.beginPath();
                            ctx.arc(sx, sy, r, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        z -= dz;
                    }
                    ctx.globalAlpha = 1;
                }

                return { draw, resize };
            }

            // Иконки режимов вида: мини-табличка 2x2 и цифры 1..4 в квадрате
            // (контуры цифр — из FiraCode Nerd Font Mono Bold).
            const VIEW_SVGS = (() => {
                const DIGIT_PATHS = {
                    1: "M10.72 10.46V11.75H5.84V10.46H7.65V5.93L6.11 6.9L5.38 5.72L7.8 4.25H9.31V10.46Z",
                    2: "M7.74 4.06Q8.6 4.06 9.17 4.36Q9.75 4.66 10.04 5.15Q10.33 5.64 10.33 6.21Q10.33 6.66 10.17 7.1Q10.02 7.53 9.67 8.02Q9.31 8.5 8.73 9.09Q8.15 9.68 7.3 10.45H10.5L10.32 11.75H5.33V10.54Q6.26 9.65 6.88 9.0Q7.51 8.36 7.88 7.89Q8.26 7.42 8.42 7.06Q8.58 6.7 8.58 6.36Q8.58 5.91 8.32 5.64Q8.06 5.38 7.58 5.38Q7.15 5.38 6.84 5.55Q6.52 5.73 6.23 6.13L5.18 5.34Q5.6 4.76 6.22 4.41Q6.84 4.06 7.74 4.06Z",
                    3: "M7.7 4.06Q8.51 4.06 9.08 4.32Q9.65 4.59 9.95 5.02Q10.25 5.46 10.25 5.98Q10.25 6.7 9.83 7.14Q9.41 7.58 8.72 7.78Q9.49 7.88 9.99 8.31Q10.49 8.73 10.49 9.64Q10.49 10.27 10.14 10.79Q9.79 11.31 9.14 11.62Q8.49 11.93 7.59 11.93Q6.75 11.93 6.08 11.64Q5.42 11.34 4.95 10.81L5.91 9.91Q6.24 10.28 6.63 10.45Q7.03 10.62 7.48 10.62Q8.03 10.62 8.38 10.34Q8.74 10.06 8.74 9.52Q8.74 8.93 8.4 8.66Q8.07 8.4 7.46 8.4H6.78L6.98 7.22H7.46Q7.96 7.22 8.28 6.98Q8.6 6.73 8.6 6.24Q8.6 5.82 8.29 5.58Q7.99 5.33 7.51 5.33Q7.06 5.33 6.69 5.51Q6.33 5.68 6.01 5.98L5.13 5.07Q5.65 4.57 6.28 4.32Q6.92 4.06 7.7 4.06Z",
                    4: "M9.99 7.09V8.89H10.74V10.18H9.99V11.75H8.35L8.34 10.18H5.23V9.04L7.32 4.06L8.77 4.6L7.0 8.89H8.35L8.55 7.09Z",
                };
                const HEAD = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">';
                const grid =
                    HEAD +
                    '<path d="M3 3 H13 V13 H3 Z M8 3 V13 M3 8 H13" stroke="#eee" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>';
                const digit = (n) =>
                    HEAD +
                    '<path d="M3 3 H13 V13 H3 Z" stroke="#eee" stroke-width="1.5" stroke-linejoin="round" fill="none"/>' +
                    `<path d="${DIGIT_PATHS[n]}" fill="#eee"/></svg>`;
                return [grid, digit(1), digit(2), digit(3), digit(4)];
            })();

            // Переключение видов: 0 — все четыре квадранта; 1..4 — один квадрант.
            // Клик по кнопке и хоткеи хоста (setView/cycleView ниже) идут сюда.
            // Переходы анимированы: квадрант плавно зумится scale(2) из своего
            // угла (CSS transition на transform/opacity).
            let viewState = 0;
            const viewBtn = document.getElementById("view-btn");

            function setView(n) {
                viewState = n;
                viewBtn.innerHTML = VIEW_SVGS[n];
                viewBtn.title = n === 0 ? "View: all quadrants" : `View: quadrant ${n}`;
                const box = document.getElementById("aspect-box");
                const cells = box.querySelectorAll(".cell");
                box.classList.toggle("single", n !== 0);
                cells.forEach((cell, i) => {
                    cell.classList.toggle("zoomed", i === n - 1);
                });
                // перерендер канвасов под новое разрешение (зум x2 или обратно)
                for (const layer of waveLayers) layer.resize();
            }

            function cycleView() {
                setView((viewState + 1) % 5);
            }

            const canvases = document.querySelectorAll(".cell .waves");
            const waveLayers = [
                createWaves(canvases[0], "#ff0000", 0.0, 0.55),
                createWaves(canvases[1], "#3333ff", 2.1, -0.5),
                createWaves(canvases[2], "#00cc00", 4.2, 0.62),
                createWaves(canvases[3], "#ffbf00", 5.5, -0.58),
            ];

            viewBtn.addEventListener("click", cycleView);
            viewBtn.innerHTML = VIEW_SVGS[0];

            // Кнопки фуллскрина/закрытия: показываем и вешаем обработчики,
            // только если страницу открыл нативный хост — он регистрирует
            // мост window.webkit.messageHandlers.host. В обычном браузере
            // моста нет, и #host-controls остаются скрытыми.
            const FS_ENTER_SVG =
                '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">' +
                '<path d="M3 6.5 V3 H6.5 M9.5 3 H13 V6.5 M13 9.5 V13 H9.5 M6.5 13 H3 V9.5" stroke="#eee" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>';
            const FS_EXIT_SVG =
                '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">' +
                '<path d="M6.5 3 V6.5 H3 M9.5 3 V6.5 H13 M6.5 13 V9.5 H3 M9.5 13 V9.5 H13" stroke="#eee" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>';
            const CLOSE_SVG =
                '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">' +
                '<path d="M4 4 L12 12 M12 4 L4 12" stroke="#eee" stroke-width="1.5" stroke-linecap="round" fill="none"/></svg>';

            const hostBridge =
                typeof window.webkit !== "undefined" &&
                window.webkit.messageHandlers &&
                window.webkit.messageHandlers.host;

            if (hostBridge) {
                const hostControls = document.getElementById("host-controls");
                const fsBtn = document.getElementById("fs-btn");
                const closeBtn = document.getElementById("close-btn");
                fsBtn.innerHTML = FS_ENTER_SVG;
                closeBtn.innerHTML = CLOSE_SVG;
                fsBtn.addEventListener("click", () => hostBridge.postMessage("fullscreen"));
                closeBtn.addEventListener("click", () => hostBridge.postMessage("close"));
                hostControls.classList.add("shown");

                // Хост зовёт это при изменении фуллскрина окна (иконка/тултип).
                window.setFullscreen = (active) => {
                    fsBtn.innerHTML = active ? FS_EXIT_SVG : FS_ENTER_SVG;
                    fsBtn.title = active ? "Exit fullscreen" : "Fullscreen";
                };
            } else {
                window.setFullscreen = () => {};
            }

            function update(t) {
                const now = new Date();
                const text = formatRFC(now);
                ["r1", "r3", "r4", "r6"].forEach((id) => {
                    const el = document.getElementById("ticker-" + id);
                    if (el) el.textContent = text;
                });
                for (const layer of waveLayers) layer.draw(t);
                requestAnimationFrame(update);
            }
            update(performance.now());
        </script>
    </body>
</html>
