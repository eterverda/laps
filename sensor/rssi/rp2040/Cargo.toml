[package]
name = "sensor-rssi-rp2040"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "sensor-rssi-rp2040"
test = false
bench = false

[dependencies]
cortex-m = "0.7"
cortex-m-rt = { version = "0.7", default-features = false }
panic-halt = "0.2"
rp2040-hal = "0.9"
rp2040-boot2 = "0.3"

[profile.release]
panic = "abort"
