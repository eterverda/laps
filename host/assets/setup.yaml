!laps-setup-1
cameras:
  camera-1:
    name: C7-1
    resolution: 1920x1080
    frame-rate: 60fps
    format: yuyv
    dvr:
      container: mkv
      frame-rate: 30fps
key-binds:
  - keys: Q
    pad-id: pad-1
    action: lap
  - keys: W
    pad-id: pad-2
    action: lap
  - keys: E
    pad-id: pad-3
    action: lap
  - keys: R
    pad-id: pad-4
    action: lap
pads:
  pad-1:
    label: R2
    color: blue
    fpv:
      camera-id: camera-1
      viewport: 2x2-r1c1-narrow
  pad-2:
    label: R3
    color: yellow
    fpv:
      camera-id: camera-1
      viewport: 2x2-r1c2-narrow
  pad-3:
    label: R5
    color: green
    fpv:
      camera-id: camera-1
      viewport: 2x2-r2c1-narrow
  pad-4:
    label: R6
    color: red
    fpv:
      camera-id: camera-1
      viewport: 2x2-r2c2-narrow
