!laps-setup-1
cameras:
  camera-1:
    name: C7-1
    resolution: 1920x1080
    frame-rate: 30fps
    format: mjpeg
    dvr:
      container: mkv
pads:
  pad-1:
    label: CH1
    color: red
    fpv:
      camera-id: camera-1
      viewport: 2x2-r1c1-narrow
  pad-2:
    label: CH2
    color: blue
    fpv:
      camera-id: camera-1
      viewport: 2x2-r1c2-narrow
  pad-3:
    label: CH3
    color: green
    fpv:
      camera-id: camera-1
      viewport: 2x2-r2c1-narrow
  pad-4:
    label: CH4
    color: yellow
    fpv:
      camera-id: camera-1
      viewport: 2x2-r2c2-narrow
