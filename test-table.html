<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Настроечная таблица</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            html,
            body {
                width: 100%;
                height: 100%;
                background: #000;
                overflow: hidden;
                font-family: "SF Mono", "Menlo", "Consolas", "Liberation Mono", "DejaVu Sans Mono", monospace;
            }
            #container {
                width: 100%;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            #aspect-box {
                width: 100vw;
                height: calc(100vw * 9 / 16);
                max-height: 100vh;
                max-width: calc(100vh * 16 / 9);
                display: grid;
                grid-template-columns: 1fr 1fr;
                grid-template-rows: 1fr 1fr;
                gap: 0;
            }
            .cell {
                position: relative;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
            }

            .waves {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                z-index: 0;
            }

            .dashed-16 {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
            }
            .dashed-16.red {
                border: 4px dashed #ff0000;
            }
            .dashed-16.blue {
                border: 4px dashed #3333ff;
            }
            .dashed-16.green {
                border: 4px dashed #00cc00;
            }
            .dashed-16.yellow {
                border: 4px dashed #ffbf00;
            }

            .solid-43 {
                position: absolute;
                top: 0;
                bottom: 0;
                left: 50%;
                transform: translateX(-50%);
                width: auto;
                aspect-ratio: 4 / 3;
                height: 100%;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                text-align: center;
                z-index: 1;
            }
            .solid-43.red {
                border: 4px solid #ff0000;
            }
            .solid-43.blue {
                border: 4px solid #3333ff;
            }
            .solid-43.green {
                border: 4px solid #00cc00;
            }
            .solid-43.yellow {
                border: 4px solid #ffbf00;
            }

            .label {
                font-size: 8vw;
                font-weight: bold;
                line-height: 1;
            }
            .label.red {
                color: #ff0000;
            }
            .label.blue {
                color: #3333ff;
            }
            .label.green {
                color: #00cc00;
            }
            .label.yellow {
                color: #ffbf00;
            }

            .ticker-wrap {
                width: 100%;
                overflow: hidden;
                white-space: nowrap;
                margin-top: 1vh;
                text-align: center;
            }
            .ticker {
                display: inline-block;
                font-size: 1.8vw;
                color: #fff;
            }
        </style>
    </head>
    <body>
        <div id="container">
            <div id="aspect-box">
                <div class="cell">
                    <canvas class="waves"></canvas>
                    <div class="dashed-16 red"></div>
                    <div class="solid-43 red">
                        <div class="label red">R1</div>
                        <div class="ticker-wrap">
                            <div class="ticker" id="ticker-r1"></div>
                        </div>
                    </div>
                </div>
                <div class="cell">
                    <canvas class="waves"></canvas>
                    <div class="dashed-16 blue"></div>
                    <div class="solid-43 blue">
                        <div class="label blue">R3</div>
                        <div class="ticker-wrap">
                            <div class="ticker" id="ticker-r3"></div>
                        </div>
                    </div>
                </div>
                <div class="cell">
                    <canvas class="waves"></canvas>
                    <div class="dashed-16 green"></div>
                    <div class="solid-43 green">
                        <div class="label green">R4</div>
                        <div class="ticker-wrap">
                            <div class="ticker" id="ticker-r4"></div>
                        </div>
                    </div>
                </div>
                <div class="cell">
                    <canvas class="waves"></canvas>
                    <div class="dashed-16 yellow"></div>
                    <div class="solid-43 yellow">
                        <div class="label yellow">R6</div>
                        <div class="ticker-wrap">
                            <div class="ticker" id="ticker-r6"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script>
            function pad(n, len) {
                return String(n).padStart(len, "0");
            }
            function formatRFC(d) {
                const y = d.getFullYear();
                const mo = pad(d.getMonth() + 1, 2);
                const da = pad(d.getDate(), 2);
                const h = pad(d.getHours(), 2);
                const mi = pad(d.getMinutes(), 2);
                const s = pad(d.getSeconds(), 2);
                const ms = pad(d.getMilliseconds(), 3);
                return `${y}-${mo}-${da} ${h}:${mi}:${s}.${ms}`;
            }

            // Точечные волны в стиле заставки AC IV: Black Flag (вид из глаз, к горизонту)
            function createWaves(canvas, color, phase, yaw) {
                const ctx = canvas.getContext("2d");
                let w = 0,
                    h = 0,
                    lastT = 0;

                // мир: камера на высоте CAM_H, повёрнута на YAW, взгляд к горизонту;
                // Z_NEAR подобран так, что ближние волны уходят под нижний край кадра
                const CAM_H = 3.0;
                const Z_NEAR = 1,
                    Z_FAR = 46;
                const STEP_PX = 12; // экранный шаг между точками (по обеим осям)
                const YAW = yaw;

                function resize() {
                    const dpr = window.devicePixelRatio || 1;
                    w = canvas.clientWidth;
                    h = canvas.clientHeight;
                    canvas.width = Math.round(w * dpr);
                    canvas.height = Math.round(h * dpr);
                    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                    draw(lastT);
                }
                resize();
                new ResizeObserver(resize).observe(canvas);

                function draw(t) {
                    lastT = t;
                    ctx.clearRect(0, 0, w, h);
                    ctx.fillStyle = color;
                    const tt = t * 0.001;
                    const f = w * 0.7; // фокусное расстояние
                    const cx = w * 0.5;
                    const horizon = h * 0.25;
                    const cosY = Math.cos(YAW),
                        sinY = Math.sin(YAW);
                    // Рисуем от дальних рядов к ближним. Шаг ряда dz подобран так, чтобы
                    // на экране расстояние между рядами было ~STEP_PX, как между точками в ряду.
                    for (let z = Z_FAR; z >= Z_NEAR; ) {
                        const dz = Math.min(2.5, Math.max(0.05, (STEP_PX * z * z) / (CAM_H * f)));
                        const fog = Math.pow(1 - (z - Z_NEAR) / (Z_FAR - Z_NEAR), 0.7); // 1 вблизи → 0 у горизонта
                        const aFog = 0.25 + fog * 0.75;
                        // мировой шаг ряда, дающий ~STEP_PX на экране
                        const dx = (STEP_PX * z) / f;
                        // ширина ряда — через tan(yaw + половина FOV) с запасом 15%,
                        // чтобы боковые кромки поля точек гарантированно были за экраном
                        const xMax = z * Math.tan(Math.abs(YAW) + Math.atan(cx / f)) * 1.15;
                        for (let x = -xMax; x <= xMax; x += dx) {
                            // детерминированный джиттер (±20% шага) — слегка разбивает регулярную сетку
                            const h1 = Math.sin(x * 127.1 + z * 311.7) * 43758.5453;
                            const h2 = Math.sin(x * 269.5 + z * 183.3) * 28081.3447;
                            const xj = x + (h1 - Math.floor(h1) - 0.5) * dx * 0.4;
                            const zj = z + (h2 - Math.floor(h2) - 0.5) * dz * 0.4;
                            // поворот камеры вокруг вертикальной оси
                            const rx = xj * cosY + zj * sinY;
                            const rz = zj * cosY - xj * sinY;
                            if (rz < 1.2) continue;
                            const scale = f / rz;
                            // волны: 4 компонента в разных направлениях — живая нерегулярная поверхность
                            const y =
                                0.5 * Math.sin(0.31 * xj + 0.83 * zj - tt * 1.7 + phase) +
                                0.3 * Math.sin(-0.57 * xj + 0.42 * zj + tt * 1.13 + phase * 1.7) +
                                0.22 * Math.sin(0.11 * xj - 0.97 * zj - tt * 0.71 + phase * 2.3) +
                                0.14 * Math.sin(0.71 * xj + 0.29 * zj + tt * 2.3);
                            const sx = cx + rx * scale;
                            if (sx < -4 || sx > w + 4) continue;
                            const sy = horizon + (CAM_H - y) * scale;
                            if (sy < -4 || sy > h + 4) continue;
                            const k = (y + 1.16) / 2.32; // 0..1: впадина..гребень
                            const r = Math.min(3.0, Math.max(0.75, 0.0195 * scale));
                            ctx.globalAlpha = (0.12 + k * 0.88) * aFog;
                            ctx.beginPath();
                            ctx.arc(sx, sy, r, 0, Math.PI * 2);
                            ctx.fill();
                        }
                        z -= dz;
                    }
                    ctx.globalAlpha = 1;
                }

                return draw;
            }

            const canvases = document.querySelectorAll(".cell .waves");
            const waveLayers = [
                createWaves(canvases[0], "#ff0000", 0.0, 0.55),
                createWaves(canvases[1], "#3333ff", 2.1, -0.5),
                createWaves(canvases[2], "#00cc00", 4.2, 0.62),
                createWaves(canvases[3], "#ffbf00", 5.5, -0.58),
            ];

            function update(t) {
                const now = new Date();
                const text = formatRFC(now);
                ["r1", "r3", "r4", "r6"].forEach((id) => {
                    const el = document.getElementById("ticker-" + id);
                    if (el) el.textContent = text;
                });
                for (const draw of waveLayers) draw(t);
                requestAnimationFrame(update);
            }
            update(performance.now());
        </script>
    </body>
</html>
