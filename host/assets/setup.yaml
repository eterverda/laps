!laps-setup-1
cameras:
  camera-1:
    name: C7-1
    resolution: 1920x1080
    frame-rate: 60fps
    format: yuyv
    dvr:
      container: mkv
      frame-rate: 30fps
# exclusive-keyboards:
#   key-1:
#     serial: 036D12307772CDBD420000000000
pads:
  pad-1:
    label: CH1
    color: red
    fpv:
      camera-id: camera-1
      viewport: 2x2-r1c1-narrow
    keybinds:
      - keys: 1+A
        action: lap
        # exclusive-keyboard-id: key-1
  pad-2:
    label: CH2
    color: blue
    fpv:
      camera-id: camera-1
      viewport: 2x2-r1c2-narrow
    keybinds:
      - keys: 2+B
        action: lap
        # exclusive-keyboard-id: key-1
  pad-3:
    label: CH3
    color: green
    fpv:
      camera-id: camera-1
      viewport: 2x2-r2c1-narrow
    keybinds:
      - keys: 3+C
        action: lap
        # exclusive-keyboard-id: key-1
  pad-4:
    label: CH4
    color: yellow
    fpv:
      camera-id: camera-1
      viewport: 2x2-r2c2-narrow
    keybinds:
      - keys: 4+D
        action: lap
        # exclusive-keyboard-id: key-1
      - keys: 5+D
        action: lap
        # exclusive-keyboard-id: key-1
      - keys: 6+D
        action: lap
        # exclusive-keyboard-id: key-1
