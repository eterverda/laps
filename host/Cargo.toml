[package]
name = "laps"
version = "0.1.0"
edition = "2024"
description = "Desktop application for the Laps timing system"

[dependencies]
bytemuck = { version = "1.25", features = ["extern_crate_alloc"] }
clap = { version = "4.6", features = ["derive"] }
resvg = "0.48"
crossbeam-channel = "0.5"
crossbeam-utils = "0.8"
eframe = "0.36"
egui = "0.36"
log = "0.4"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0"
time = { version = "0.3", features = ["macros", "local-offset", "formatting", "parsing"] }
yuv = "0.8.17"
env_logger = "0.11.11"
lazy-regex = "3.6.1"
memchr = "2"
zune-jpeg = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
nokhwa = { version = "0.10.11", default-features = false, features = ["input-avfoundation"] }
nokhwa-bindings-macos = "0.2.4"

[target.'cfg(target_os = "linux")'.dependencies]
nokhwa = { version = "0.10.11", default-features = false, features = ["input-v4l"] }

[target.'cfg(target_os = "windows")'.dependencies]
nokhwa = { version = "0.10.11", default-features = false, features = ["input-msmf"] }

[profile.dev.package.yuv]
opt-level = 2

[profile.dev.package.zune-jpeg]
opt-level = 3

[profile.dev.package.zune-core]

[profile.dev.package.memchr]
opt-level = 3
[profile.dev.package.epaint]
opt-level = 2

[package.metadata.bundle]
name = "Laps"
identifier = "ru.fpvladder.laps"
icon = ["packaging/osx/icon.icns"]
osx_minimum_system_version = "10.15"
osx_info_plist_exts = ["packaging/osx/Info.plist.ext"]

[profile.dev.package."laps"]
opt-level = 2
